<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Spin</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <!-- 🍕 LINKERKANT -->
        <div class="pizza-area" id="pizzaArea">

            <h1>🍕 PIZZA SPIN</h1>

            <p class="instruction">
                Beweeg je muis rond de pizza!
            </p>

            <div class="pizza" id="pizza">
                <div class="crust"></div>
                <div class="cheese"></div>

                <div class="pepperoni p1"></div>
                <div class="pepperoni p2"></div>
                <div class="pepperoni p3"></div>
                <div class="pepperoni p4"></div>
                <div class="pepperoni p5"></div>
                <div class="pepperoni p6"></div>
                <div class="pepperoni p7"></div>
                <div class="pepperoni p8"></div>
            </div>

            <div class="spin-counter">
                🔄 Draaiingen:
                <span id="spins">0</span>
            </div>

            <!-- LEVEL -->
            <div class="level-box">
                ⭐ Level:
                <span id="level">1</span>

                <div class="xp-bar">
                    <div class="xp-progress" id="xpProgress"></div>
                </div>

                <p>
                    XP:
                    <span id="xp">0</span>
                    /
                    <span id="xpNeeded">100</span>
                </p>
            </div>

        </div>


        <!-- 🛒 RECHTERKANT -->
        <div class="shop">

            <h2>🛒 UPGRADES</h2>

            <div class="pepperoni-count">
                🍕 Pepperoni:
                <span id="pepperoni">0</span>
            </div>

            <div class="production">

                ⚡ Per draai:
                <span id="perSpin">1</span>

                <br>

                🤖 Per seconde:
                <span id="perSecond">0</span>

            </div>

            <div id="upgradeList"></div>


            <!-- 🏆 ACHIEVEMENTS -->

            <div class="achievements-section">

                <h2>🏆 ACHIEVEMENTS</h2>

                <div id="achievementList"></div>

            </div>


            <!-- RESET -->

            <button class="save-button" id="resetButton">
                🗑️ Reset Game
            </button>

        </div>

    </div>


    <!-- ACHIEVEMENT MELDING -->

    <div id="achievementPopup" class="achievement-popup">

        <div class="popup-title">
            🏆 ACHIEVEMENT!
        </div>

        <div id="popupText">
            Achievement gehaald!
        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
